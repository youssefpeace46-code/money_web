<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5139"><link rel="icon" href="./icons/icon.svg"><link rel="stylesheet" href="./src/styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><title>إدارة سوق المشير</title></head><body class="admin-body"><main class="admin-shell">
<nav class="admin-nav"><a class="brand" href="./"><img src="./icons/icon.svg" alt=""><b>سوق المشير المالي</b></a><button id="logoutBtn" class="btn btn-soft admin-hidden">تسجيل الخروج</button></nav>
<section id="loginView" class="auth-card"><span class="eyebrow">منطقة خاصة</span><h1>دخول الإدارة</h1><p class="muted">استخدم حساب المدير المسجل في Supabase.</p><form id="loginForm" class="admin-form"><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><div id="loginMessage" class="form-message"></div><button class="btn btn-primary" type="submit">تسجيل الدخول</button></form></section>
<section id="dashboard" class="admin-hidden"><div class="section-head"><div><span class="eyebrow">لوحة الإدارة</span><h1>مرحبًا بك</h1></div></div><div id="adminMessage" class="form-message"></div><div class="stats"><div class="stat"><span>بانتظار المراجعة</span><b id="pendingCount">—</b></div><div class="stat"><span>منشورة</span><b id="publishedCount">—</b></div><div class="stat"><span>الأخبار</span><b id="newsCount">—</b></div></div>
<div class="admin-grid"><section class="panel"><h2>نشر خبر</h2><form id="newsForm" class="admin-form"><label>نص الخبر<textarea name="content" required maxlength="240" rows="3"></textarea></label><label>الترتيب<input name="sort_order" type="number" value="0" min="0"></label><button class="btn btn-primary">نشر الخبر</button></form></section><section class="panel"><h2>إضافة عرض إداري</h2><form id="adminOfferForm" class="admin-form"><label>القسم<select name="category"></select></label><label>العملية<select name="operation"><option>بيع</option><option>شراء</option></select></label><label>المبلغ<input name="amount" required maxlength="60"></label><label>السعر<input name="price" maxlength="60"></label><label>المدينة<input name="city" required maxlength="60"></label><label>WhatsApp<input name="whatsapp" required pattern="[+0-9 ]{9,16}"></label><button class="btn btn-primary">نشر العرض</button></form></section>
<section class="panel full-panel"><h2>العروض</h2><div class="table-wrap"><table><thead><tr><th>العرض</th><th>المدينة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="offersTable"></tbody></table></div></section><section class="panel full-panel"><h2>شريط الأخبار</h2><table><thead><tr><th>الخبر</th><th>الترتيب</th><th>إجراءات</th></tr></thead><tbody id="newsTable"></tbody></table></section></div></section></main><script type="module" src="./src/admin.js"></script></body></html>
